<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DevRacha</title>
<style>
:root{--bg:#fbf4ff;--p:#fff;--l:#e3d6ff;--m:#d2f4e6;--pe:#ffe0d2;--s:#d2e8ff;--pk:#ffd6ea;--t:#4a4560;--ac:#a78bfa}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--l);font-size:18px;flex-wrap:wrap;gap:6px}
header span{font-size:14px}
#app{display:flex;min-height:calc(100vh - 50px)}
nav{width:58px;background:var(--s);padding:8px 4px;display:flex;flex-direction:column;gap:6px}
nav button{border:0;background:none;border-radius:12px;padding:8px 2px;font-size:20px;cursor:pointer;color:var(--t)}
nav button small{display:none;font-size:14px;margin-left:8px}
nav button.on{background:var(--p);box-shadow:0 2px 6px #0002}
main{flex:1;padding:14px;min-width:0}
@media(min-width:700px){nav{width:190px}nav button{text-align:left;padding:10px}nav button small{display:inline}}
.card{background:var(--p);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.b{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-size:15px;margin:2px}
.b.g{background:var(--m);color:var(--t)}
.b.r{background:var(--pk);color:var(--t)}
input,textarea{padding:8px;border:2px solid var(--l);border-radius:10px;font:inherit;max-width:100%}
.big{font-size:56px;text-align:center;margin:10px}
.c{text-align:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid div{padding:8px 0;border-radius:8px;background:var(--bg)}
.grid .st{background:var(--m)}
.grid .td{outline:2px solid var(--ac)}
.mt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.mt button{min-height:70px;font-size:12px;border:0;border-radius:10px;background:var(--l);color:var(--t);cursor:pointer;padding:4px}
.mt .ok{background:var(--m)}
.mt .sel{background:var(--pe)}
.flip{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:20px;cursor:pointer;background:var(--pk)}
details{margin:6px 0}
summary{cursor:pointer;font-weight:600}
</style>
</head>
<body>
<header><b>🎓 DevRacha</b><span id="hd"></span></header>
<div id="app"><nav id="nav"></nav><main id="main"></main></div>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const td=d=>(d||new Date()).toLocaleDateString('sv');
const DEF=[
{n:'Front end',i:[
['HTML','Estructura de la página: títulos, párrafos, imágenes, enlaces y formularios.','MDN Web Docs (developer.mozilla.org) y w3schools.com'],
['CSS','Estilos de la página: colores, tamaños, tipografías y distribución.','MDN Web Docs y css-tricks.com'],
['JavaScript','Da vida a la página: reacciona a clics, valida formularios y cambia el contenido.','javascript.info y MDN Web Docs'],
['Responsive','La página se adapta a celular, tablet y computador.','web.dev y MDN: Diseño responsivo']]},
{n:'Back end',i:[
['Servidor','Computador que recibe las peticiones del navegador y envía respuestas.','MDN: Introducción al lado servidor'],
['Base de datos','Lugar donde se guardan los datos: usuarios, notas, productos.','w3schools.com/sql y la documentación de MongoDB'],
['API','Puente de comunicación entre front end y back end, normalmente con JSON.','MDN: Fetch API y restfulapi.net'],
['Autenticación','Verifica quién eres (login) y qué puedes hacer en el sistema.','owasp.org y la documentación de Auth0']]}];
let S=null;try{S=JSON.parse(localStorage.getItem('devracha'))}catch(e){}
S=S||{topics:DEF,notes:[],tasks:[],days:{},xp:0,best:0};
const save=()=>{try{localStorage.setItem('devracha',JSON.stringify(S))}catch(e){}hd()};
function streak(){let n=0,d=new Date();if(!S.days[td(d)])d.setDate(d.getDate()-1);while(S.days[td(d)]){n++;d.setDate(d.getDate()-1)}return n}
function hd(){$('#hd').textContent='🔥 Racha: '+streak()+' · ⭐ Nivel '+(Math.floor(S.xp/100)+1)+' ('+(S.xp%100)+'/100 XP)'}
const MENU=[['estudio','⏱️','Estudio'],['temas','📚','Qué estudiar'],['notas','📝','Notas'],['cal','📅','Calendario'],['tareas','✅','Tareas'],['practica','🧩','Práctica'],['quiz','🎯','Quiz'],['prog','💾','Progreso']];
let cur='estudio';
function go(v){cur=v;$('#nav').innerHTML=MENU.map(m=>`<button class="${m[0]==v?'on':''}" onclick="go('${m[0]}')">${m[1]}<small>${m[2]}</small></button>`).join('');$('#main').innerHTML=V[v]()}
function del(k,i){S[k].splice(i,1);save();go(cur)}
const V={};

/* ESTUDIO */
let tl=1500,iv=null;
const fmt=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
function showT(){const e=$('#clk');if(e)e.textContent=fmt(tl)}
function setM(){if(!iv){tl=Math.max(1,+$('#mins').value||25)*60;showT()}}
function startT(){if(iv)return;iv=setInterval(()=>{tl--;if(tl%60==0){S.days[td()]=(S.days[td()]||0)+1;S.xp+=2;save()}showT();if(tl<=0){pauseT();tl=1500;showT();alert('¡Tiempo cumplido! 🎉')}},1000)}
function pauseT(){clearInterval(iv);iv=null}
function resetT(){pauseT();setM()}
V.estudio=()=>`<div class="card"><h2>Temporizador de estudio</h2><div class="big" id="clk">${fmt(tl)}</div><p class="c">Minutos: <input id="mins" type="number" value="${Math.round(tl/60)||25}" min="1" max="180" style="width:70px" onchange="setM()"></p><p class="c"><button class="b" onclick="startT()">▶ Iniciar</button><button class="b g" onclick="pauseT()">⏸ Pausa</button><button class="b r" onclick="resetT()">↺ Reiniciar</button></p><p>Cada minuto estudiado suma XP y mantiene tu racha 🔥</p></div>`;

/* QUÉ ESTUDIAR */
V.temas=()=>`<div class="card"><input id="nt" placeholder="Nuevo tema (ej. Python)"> <button class="b" onclick="addT()">+ Agregar tema</button></div>`+S.topics.map((t,i)=>`<div class="card"><h3>${esc(t.n)} <button class="b r" onclick="delT(${i})">🗑</button></h3>${t.i.map((s,j)=>`<details><summary>${esc(s[0])}</summary><p>${esc(s[1])}</p><p>📍 <i>${esc(s[2])}</i></p><button class="b r" onclick="delS(${i},${j})">Eliminar subtema</button></details>`).join('')}<button class="b g" onclick="addS(${i})">+ Subtema</button></div>`).join('');
function addT(){const v=$('#nt').value.trim();if(v){S.topics.push({n:v,i:[]});save();go('temas')}}
function delT(i){if(confirm('¿Eliminar este tema?')){S.topics.splice(i,1);save();go('temas')}}
function addS(i){const a=prompt('Título del subtema');if(!a)return;const b=prompt('Explicación')||'';const c=prompt('¿Dónde encontrar la información?')||'';S.topics[i].i.push([a,b,c]);save();go('temas')}
function delS(i,j){S.topics[i].i.splice(j,1);save();go('temas')}

/* NOTAS */
V.notas=()=>`<div class="card"><textarea id="nn" rows="3" style="width:100%" placeholder="Escribe una nota de la clase..."></textarea><button class="b" onclick="addN()">Guardar nota</button></div>`+S.notes.map((n,i)=>`<div class="card">${esc(n.t).replace(/\n/g,'<br>')}<br><small>${n.d}</small> <button class="b r" onclick="del('notes',${i})">🗑</button></div>`).join('');
function addN(){const v=$('#nn').value.trim();if(v){S.notes.unshift({t:v,d:td()});save();go('notas')}}

/* CALENDARIO */
let cm=new Date();cm.setDate(1);
function mv(n){cm.setMonth(cm.getMonth()+n);go('cal')}
V.cal=()=>{const y=cm.getFullYear(),m=cm.getMonth(),f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();let h='';for(let i=0;i<f;i++)h+='<div></div>';for(let d=1;d<=n;d++){const k=td(new Date(y,m,d)),mi=S.days[k];h+=`<div class="${mi?'st':''} ${k==td()?'td':''}">${d}${mi?'<br><small>'+mi+'m</small>':''}</div>`}
return `<div class="card"><h2>📅 ${cm.toLocaleString('es',{month:'long',year:'numeric'})}</h2><p><button class="b g" onclick="mv(-1)">◀</button><button class="b g" onclick="mv(1)">▶</button> 🔥 Racha: ${streak()} días</p><div class="grid">${'DLMMJVS'.split('').map(x=>`<div><b>${x}</b></div>`).join('')}${h}</div><p>Verde = día estudiado (minutos).</p></div>`};

/* TAREAS */
V.tareas=()=>`<div class="card"><input id="tt" placeholder="Tarea"> <input id="tdate" type="date"> <button class="b" onclick="addK()">+ Agregar</button></div>`+(S.tasks.map((k,i)=>`<div class="card" style="${k.ok?'opacity:.6':''}"><label><input type="checkbox" ${k.ok?'checked':''} onchange="tog(${i})"> <b>${esc(k.t)}</b></label> <small>${k.d||''}</small> <button class="b r" onclick="del('tasks',${i})">🗑</button></div>`).join('')||'<p>Sin tareas 🎉</p>');
function addK(){const v=$('#tt').value.trim();if(v){S.tasks.push({t:v,d:$('#tdate').value,ok:0});save();go('tareas')}}
function tog(i){const k=S.tasks[i];k.ok=!k.ok;if(k.ok)S.xp+=5;save();go('tareas')}

/* PRÁCTICA */
let pt=0,ci=0,fl=0,pc=[],sel=null,mv2=0,li=0,ls=0;
const pool=()=>S.topics.flatMap(t=>t.i);
const CL=[['Botones y colores de la página',0],['Guardar usuarios en una base de datos',1],['Validar un formulario antes de enviarlo',0],['Verificar la contraseña de un login',1],['Menú que se adapta al celular',0],['Crear una API que devuelve JSON',1],['Animación al pasar el mouse',0],['Servidor que responde peticiones',1]];
function mkP(){pc=pool().slice().sort(()=>Math.random()-.5).slice(0,6).flatMap((c,i)=>[{id:i,x:c[0],ok:0},{id:i,x:c[1],ok:0}]).sort(()=>Math.random()-.5);sel=null;mv2=0}
function pick(i){const c=pc[i];if(c.ok||sel===i)return;if(sel===null)sel=i;else{mv2++;if(pc[sel].id==c.id){pc[sel].ok=c.ok=1;S.xp+=3;save()}sel=null}go('practica')}
function ans(v){const r=CL[li][1]==v;if(r){ls++;S.xp+=2;save()}alert(r?'✅ ¡Correcto!':'❌ Era '+(CL[li][1]?'Back end':'Front end'));li++;go('practica')}
function cards(){const p=pool(),n=p.length;if(!n)return '<div class="card">Agrega subtemas primero.</div>';const c=p[ci%n];return `<div class="card flip" onclick="fl=!fl;go('practica')">${fl?esc(c[1]):'<b>'+esc(c[0])+'</b>'}</div><p class="c"><button class="b g" onclick="ci=(ci%${n}+${n-1})%${n};fl=0;go('practica')">◀</button> ${ci%n+1}/${n} <button class="b g" onclick="ci++;fl=0;go('practica')">▶</button></p><p class="c"><small>Toca la tarjeta para voltearla</small></p>`}
function pairs(){if(!pc.length)mkP();if(!pc.length)return '<div class="card">Agrega subtemas primero.</div>';const w=pc.every(c=>c.ok);return `<div class="card"><p>Relaciona cada subtema con su explicación. Intentos: ${mv2}${w?' — 🎉 ¡Ganaste!':''}</p><div class="mt">${pc.map((c,i)=>`<button class="${c.ok?'ok':sel===i?'sel':''}" onclick="pick(${i})">${esc(c.x)}</button>`).join('')}</div><button class="b" onclick="mkP();go('practica')">Nuevo juego</button></div>`}
function cls(){if(li>=CL.length)return `<div class="card"><h3>Puntaje: ${ls}/${CL.length} 🎉</h3><button class="b" onclick="li=0;ls=0;go('practica')">Repetir</button></div>`;return `<div class="card"><p>${li+1}/${CL.length} · ¿Es front end o back end?</p><h3>${CL[li][0]}</h3><button class="b" onclick="ans(0)">🎨 Front end</button><button class="b g" onclick="ans(1)">🗄️ Back end</button></div>`}
V.practica=()=>`<div class="card">${['🃏 Tarjetas','🔗 Parejas','⚡ ¿Front o Back?'].map((x,i)=>`<button class="b ${pt==i?'':'g'}" onclick="pt=${i};mkP();go('practica')">${x}</button>`).join('')}</div>`+[cards,pairs,cls][pt]();

/* QUIZ (10 preguntas) */
const Q=[
['¿Qué es el front end?',['La parte visible con la que interactúa el usuario','El servidor y la base de datos','El cableado de internet'],0],
['¿Qué lenguaje da estructura a una página web?',['CSS','HTML','SQL'],1],
['¿Para qué sirve CSS?',['Dar estilo y diseño','Guardar datos','Crear servidores'],0],
['¿Qué lenguaje hace interactiva la página en el navegador?',['HTML','JavaScript','Excel'],1],
['¿Dónde se guardan los datos de los usuarios?',['En el CSS','En la base de datos','En una imagen'],1],
['¿Qué hace el back end?',['Elige los colores','Procesa peticiones y lógica en el servidor','Dibuja botones'],1],
['¿Qué es una API?',['Un tipo de imagen','Un puente para que front end y back end se comuniquen','Un navegador'],1],
['Una página "responsive" es la que...',['Se adapta a distintos tamaños de pantalla','Carga más lento','No usa HTML'],0],
['¿Cuál es una tarea del back end?',['Verificar un login','Cambiar la fuente','Animar un botón'],0],
['Cuando escribes una URL, el navegador envía al servidor una...',['Petición (request)','Imagen','Contraseña'],0]];
let qi=0,qs=0;
V.quiz=()=>{if(qi>=Q.length)return `<div class="card"><h2>Resultado: ${qs}/10</h2><p>Mejor puntaje: ${S.best}/10</p><button class="b" onclick="qi=0;qs=0;go('quiz')">Reintentar</button></div>`;const q=Q[qi];return `<div class="card"><p>Pregunta ${qi+1}/10</p><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="b g" style="display:block;width:100%;text-align:left" onclick="qa(${i})">${o}</button>`).join('')}</div>`};
function qa(i){const r=i==Q[qi][2];if(r){qs++;S.xp+=3}alert(r?'✅ ¡Correcto!':'❌ Incorrecto. Respuesta: '+Q[qi][1][Q[qi][2]]);qi++;if(qi>=Q.length&&qs>S.best)S.best=qs;save();go('quiz')}

/* PROGRESO + EXPORTAR/IMPORTAR */
V.prog=()=>{const m=Object.values(S.days).reduce((a,b)=>a+b,0);return `<div class="card"><h2>Tu progreso</h2><p>🔥 Racha: ${streak()} días<br>⭐ XP: ${S.xp} (nivel ${Math.floor(S.xp/100)+1})<br>⏱️ Minutos estudiados: ${m}<br>🎯 Mejor quiz: ${S.best}/10<br>✅ Tareas hechas: ${S.tasks.filter(k=>k.ok).length}/${S.tasks.length}</p></div><div class="card"><h3>Guardar o pasar tu progreso</h3><button class="b" onclick="exp()">⬇ Exportar</button> <label class="b g">⬆ Importar<input type="file" accept=".json" hidden onchange="imp(this)"></label></div>`};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='devracha-progreso.json';a.click()}
function imp(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.topics)throw 0;S=d;save();alert('Progreso importado ✅');go('prog')}catch(e){alert('Archivo no válido')}};r.readAsText(f)}

hd();go('estudio');
</script>
</body>
</html>
